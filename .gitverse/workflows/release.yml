name: Auto Tag Release

on:
  push:
    branches:
      - main
      - master

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Необходимо для получения всех тегов из истории

      - name: Bump Version and Tag
        run: |
          # Получаем последний тег (если нет, используем v0.0.0)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Current tag: $LAST_TAG"
          
          # Парсим версию (удаляем 'v' в начале)
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # Получаем сообщение последнего коммита
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          
          # Анализируем conventional commit
          if echo "$MSG" | grep -iqE "^feat(\([^)]+\))?:"; then
            echo "Feat detected: minor version bump"
            MINOR=$((MINOR + 1))
            PATCH=0
          elif echo "$MSG" | grep -iqE "^(fix|chore)(\([^)]+\))?:"; then
            echo "Fix/Chore detected: patch version bump"
            PATCH=$((PATCH + 1))
          elif echo "$MSG" | grep -iqE "^(docs|test|tests)(\([^)]+\))?:"; then
            echo "Docs/Test detected: skipping tag creation"
            exit 0
          else
            echo "No recognizable type requiring a tag: skipping tag creation"
            exit 0
          fi
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"
          
          # Настраиваем Git
          git config user.name "GitVerse Actions"
          git config user.email "actions@gitverse.ru"
          
          # Пушим тег
          git tag $NEW_TAG
          git push origin $NEW_TAG

